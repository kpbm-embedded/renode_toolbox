# 32_06_renode pixi env (managed by ./renode-box, see README.md). conda-forge only, pinned by
# pixi.lock; env in ./.pixi, package caches in ./cache. Holds what Renode's portable build
# does not bundle: the Python side of `renode-test` (Robot Framework, versions from
# renode/tests/requirements.txt), GNU make for the example firmware and dts2repl.
# Renode itself, the Arm/RISC-V GCC and FreeRTOS are pinned tarballs (config/pins.tsv).
[workspace]
name = "renode_box"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
pip = "*"

[target.unix.dependencies]
make = "4.*"

[target.win-64.dependencies]
m2-make = "*"

# renode 1.17.0 tests/requirements.txt (+ tools/csv2resd, tools/execution_tracer)
[pypi-dependencies]
robotframework = "==6.1"
robotframework-retryfailed = "==0.2.0"
psutil = "==5.9.4"
pyyaml = "==6.0.*"
telnetlib3 = "==2.0.*"
construct = "==2.10.68"
pyelftools = "==0.30"
# DTS -> .repl converter (Antmicro), pinned to main @ 2026-10-19
dts2repl = { git = "https://github.com/antmicro/dts2repl", rev = "c94a6ad281f696f501064cfa2aad94a7410d6086" }
# WebSocket client for the server-mode API tests (renode --server-mode, protocol 1.5.0)
websockets = "==15.0.*"
# LCOV .info merge/diff for the coverage flow (Antmicro), pinned to main @ 2026-09-28
info-process = { git = "https://github.com/antmicro/info-process", rev = "58cb48acaf0f0644d10367319e50640970dfec1a" }
